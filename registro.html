<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">

        <title>Registro - NutriPro</title>
        <link rel="stylesheet" href="./styles.css">
    </head>
    <body>

         <header>
            <div class="header-search">
                <input type="text" placeholder="Buscar productos...">
            </div>

            <a href="index.html">
                <img src="logo5.png" alt="NutriPro" width="280">
            </a>

            <div class="header-links">
                <a href="login.html">Iniciar sesión</a>
                <a href="registro.html">Registrarse</a>
            </div>
        </header>

        <nav>
            <input type="checkbox" id="menu-toggle">
            <label for="menu-toggle" class="menu-icon">☰</label>

            <ul class="nav-links">
                <a href="creatinas.html">CREATINAS</a>
                <a href="proteinas.html">PROTEÍNAS</a>
                <a href="pre-entrenos.html">PRE-ENTRENOS</a>
                <a href="mas-productos.html">MÁS PRODUCTOS</a>
            </ul>
        </nav>

        <form>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
            <br>
            <br>
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" required>
            <br>
            <br>
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>
            <br>
            <br>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="Contraseña" required>
            <br>
            <br>
            <label for="fecha_nacimiento">Fecha de nacimiento:</label>
            <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
            <br>
            <br>
            <br>
            
            <input type="submit" value="Registrarme">
        </form>

        <footer>
            Seguinos en nuestro <a href="https://www.instagram.com/nutripro_suplementos.store/" target="_blank">Instagram</a>
            <br>
            <br>
            <p>Este sitio fue desarrollado por Juan Paez Enrico. 2026.</p>
        </footer>
    </body>
</html>
